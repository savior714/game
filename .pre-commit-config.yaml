repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: staged-security
        name: staged security gate
        entry: just commit-gate-hard
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: typecheck
        name: typecheck
        entry: just typecheck
        language: system
        types: [python]
        pass_filenames: false

      - id: verify
        name: verify
        entry: ./verify.sh
        language: system
        pass_filenames: false

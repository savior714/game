<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 · 가입 계정 | AIDEN GAME LABS</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Outfit', 'Pretendard', -apple-system, sans-serif; word-break: keep-all; }
    
    /* Ambient Glow Mesh */
    .console-bg-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: 
        radial-gradient(circle at 50% 0%, rgba(215, 255, 0, 0.08), transparent 40%),
        radial-gradient(circle at 10% 30%, rgba(6, 182, 212, 0.06), transparent 45%),
        radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.06), transparent 50%),
        radial-gradient(circle at 50% 100%, rgba(7, 9, 14, 0.95), #07090e);
    }
  </style>
</head>
<body class="bg-[#07090e] min-h-screen text-slate-100 pb-16 relative selection:bg-[#d7ff00]/30 selection:text-[#d7ff00]">

  <!-- Ambient Glow Background -->
  <div class="console-bg-glow"></div>

  <!-- Top Console HUD Navigation Bar -->
  <div class="max-w-2xl mx-auto px-5 pt-4">
    <header class="w-full flex items-center justify-between gap-4 px-5 py-3 rounded-full bg-[#0e1422]/85 backdrop-blur-xl border border-white/10 shadow-2xl sticky top-4 z-50">
      <div class="flex items-center gap-4">
        <a href="../../index.html" class="flex items-center gap-3 no-underline group" aria-label="AIDEN GAME LABS 메인 홈">
          <div class="w-2.5 h-2.5 rounded-full bg-[#d7ff00] shadow-[0_0_10px_#d7ff00]"></div>
          <div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-black tracking-widest text-[#d7ff00] uppercase">AIDEN GAME LABS</span>
              <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-white/10 text-slate-300 font-semibold">v2.0</span>
            </div>
            <div class="text-xs font-bold text-slate-400">관리자 시스템</div>
          </div>
        </a>

        <button type="button" onclick="location.href='../../index.html'" class="px-3.5 py-1.5 flex items-center gap-1.5 rounded-full bg-white/10 hover:bg-white/20 border border-white/10 text-slate-200 font-bold text-xs transition-all shrink-0" aria-label="메인 홈으로 이동">
          <svg class="w-4 h-4 text-[#d7ff00]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>홈으로</span>
        </button>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <button type="button" id="btn-login" class="text-xs font-black bg-[#d7ff00] text-black hover:bg-[#c7ee00] px-4 py-1.5 rounded-full shadow-[0_0_15px_rgba(215,255,0,0.4)] transition-all">구글 로그인</button>
        <button type="button" id="btn-logout" class="hidden text-xs font-bold text-slate-400 hover:text-white px-3 py-1.5">로그아웃</button>
      </div>
    </header>
  </div>

  <main class="max-w-2xl mx-auto px-5 py-6 relative z-10">

    <div id="gate" class="bg-[#0e1422]/90 backdrop-blur-xl rounded-2xl p-8 shadow-2xl border border-white/10 text-center">
      <p id="status" class="text-sm text-slate-300 mb-4 font-semibold">구글로 로그인해 주세요.</p>
      <p class="text-xs text-slate-500 leading-relaxed">
        접속 URL은 북마크만 사용하세요. 메인 화면에는 관리자 링크를 두지 않았습니다.<br>
        <code class="text-[11px] bg-white/5 text-slate-400 px-1.5 py-0.5 rounded border border-white/10 font-mono">domains/auth/auth.js</code>의 관리자 이메일과 Supabase RLS 정책의 이메일을 동일하게 설정해야 합니다.
      </p>
    </div>

    <div id="admin-panel" class="hidden">
      <div class="flex items-center justify-between mb-4">
        <p class="text-sm text-slate-300">
          로그인: <span id="admin-email" class="font-bold text-[#d7ff00] font-mono"></span>
        </p>
        <button type="button" id="btn-refresh" class="text-xs font-bold text-[#38bdf8] hover:text-[#0ea5e9] bg-white/5 border border-white/10 px-3 py-1.5 rounded-lg transition-all">새로고침</button>
      </div>

      <div class="bg-[#0e1422]/90 backdrop-blur-xl rounded-2xl shadow-2xl border border-white/10 overflow-hidden">
        <div class="px-5 py-3 border-b border-white/10 flex justify-between items-center bg-white/5">
          <span class="text-sm font-bold text-white">활성 계정</span>
          <span class="text-xs text-slate-400 font-mono"><span id="user-count" class="text-[#d7ff00] font-bold">0</span>명</span>
        </div>
        <ul id="user-list" class="px-5 py-2 max-h-[70vh] overflow-y-auto divide-y divide-white/5"></ul>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수학 놀이 | AIDEN GAME LABS</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
  
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="rocket.css">
</head>
<body class="selection:bg-[#d7ff00]/30 selection:text-[#d7ff00]">

  <!-- Top Console HUD Navigation Bar (Unified Header) -->
  <a href="../../index.html" class="home-link console-hud" aria-label="AIDEN GAME LABS 메인 홈으로 이동">
    <div class="hud-left-section">
      <div class="brand-badge">
        <div class="brand-dot"></div>
        <div>
          <div class="brand-subline">
            <span class="brand-title">AIDEN GAME LABS</span>
            <span class="brand-version">v2.0</span>
          </div>
          <div class="brand-category">수리와 계산</div>
        </div>
      </div>
    </div>
    <div class="home-pill-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>홈으로</span>
    </div>
  </a>

  <h1>🔢 수학 놀이</h1>

    <!-- 일일 스킬 목표 위젯 -->
    <div id="daily-goal-banner" class="daily-goal-container" aria-live="polite">
      <div class="daily-goal-icon" aria-hidden="true">🎯</div>
      <div class="daily-goal-content">
        <div class="daily-goal-header">
          <span class="daily-goal-title">오늘의 목표</span>
          <span id="daily-goal-status" class="daily-goal-badge">도전 중</span>
          <span id="daily-goal-streak" class="daily-goal-streak-badge" aria-label="연속 학습">🔥 0일 연속</span>
        </div>
        <div id="daily-goal-desc" class="daily-goal-desc">10 이하의 덧셈 연습하기</div>
        <div class="daily-goal-progress-wrap" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="5">
          <div id="daily-goal-progress-bar" class="daily-goal-progress-fill" style="width: 0%;"></div>
        </div>
      </div>
      <div id="daily-goal-count" class="daily-goal-counter">0 / 5</div>
    </div>

    <div id="score-board">
      <div class="score-item">문제 <span id="q-count">1</span> / 10</div>
      <div class="score-item">점수 <span id="q-score">0</span></div>
      <button id="stats-btn">📊 통계</button>
    </div>

    <div id="main-area">

      <!-- 로켓 패널 -->
      <div id="rocket-panel">
        <div id="rp-space-label" class="rp-zone-label">SPACE</div>
        <div id="rp-track">
          <div id="rp-nebula"></div>
          <div id="rp-stars"></div>
          <div class="rp-cloud rp-cloud--a"><span></span></div>
          <div class="rp-cloud rp-cloud--b"><span></span></div>
          <div id="rp-atmosphere-glow"></div>
          <div id="rp-ground"></div>
          <div id="rp-goal-earth" aria-label="goal-earth"></div>
          <div id="rp-flame">🔥</div>
          <div id="rp-rocket">🚀</div>
        </div>
        <div id="rp-ground-label" class="rp-zone-label">EARTH</div>
        <div id="streak-badge">🔥 0 / 20</div>
      </div>

      <!-- 게임 카드 -->
      <div id="game-card">
        <div id="game-area">
          <div id="timer-label">⏱ <span id="timer-text">20</span>초</div>
          <div id="timer-wrap"><div id="timer-bar"></div></div>
          <div id="question"></div>
          <div id="answer-buttons"></div>
          <div id="feedback"></div>
          <button id="next-btn">다음 문제 ▶</button>
        </div>

        <div id="result-screen">
          <div id="stars"></div>
          <h2 id="result-title"></h2>
          <p id="result-msg"></p>
          <button id="restart-btn">다시 하기!</button>
        </div>
      </div>

    </div>

    <!-- 통계 모달 -->
    <div id="stats-modal" data-action="modal-backdrop">
      <div id="stats-box" role="dialog" aria-modal="true" aria-labelledby="stats-dialog-title">
        <h3 id="stats-dialog-title">📊 연산별 기록</h3>
        <table id="stats-table">
          <thead>
            <tr>
              <th>연산</th><th>시도</th><th>정답률</th><th>평균 시간</th><th>숙련도</th>
            </tr>
          </thead>
          <tbody id="stats-tbody"></tbody>
        </table>
        <div class="stats-actions">
          <button id="close-stats-btn">닫기</button>
          <button id="reset-stats-btn">기록 초기화</button>
        </div>
      </div>
    </div>

  <script src="sound.js"></script>
  <script src="../../shared/event-bus.js"></script>
  <script src="../../shared/domain/progress-engine.js"></script>

  <!-- 효능감 시스템 (기존 엔진 전에 로드) -->
  <script src="../../shared/domain/milestone-tracker.js"></script>
  <script src="../../shared/domain/daily-streak.js"></script>
  <script src="../../shared/domain/diversity-reward.js"></script>
  <script src="../../shared/domain/growth-visualizer.js"></script>

  <!-- 수학 스킬, 증거, 숙달도, 적응형 선택, 일일 목표 엔진 -->
  <script src="skills.js"></script>
  <script src="evidence.js"></script>
  <script src="mastery.js"></script>
  <script src="adaptive-selector.js"></script>
  <script src="daily-goal.js"></script>

  <script src="engine.js"></script>
  <script src="../../shared/ui/particle-pool.js"></script>
  <script src="../../shared/ui/rocket-effects.js"></script>
  <script src="../../shared/ui/rocket-core.js"></script>
  <script src="rocket.js"></script>
  <script src="../../shared/ui/quiz-ui-core.js"></script>
  <script src="ui.js"></script>
  <script src="../../shared/domain/free-time-allowance.js"></script>
  <script src="../../shared/domain/free-time-session.js"></script>
  <script src="../../shared/domain/external-tab-launcher.js"></script>
  <script src="../../domains/reward/free-time-session-start-transaction.js"></script>
  <script src="../../domains/reward/reward_ui.js"></script>
  <script src="../../domains/reward/reward.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200">
  <g id="scene-seaweed-loop-03">
    <!-- Main asymmetrical outer loop strand featuring double-bulge frond curve -->
    <path d="M60 188 C30 175 14 140 18 95 C22 50 48 18 72 24 C96 30 106 65 98 110 C90 155 75 182 60 188 Z" fill="none" stroke="#2D8B46" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Vibrant secondary inner strand -->
    <path d="M60 185 C32 172 18 138 21 95 C25 52 49 22 70 27 C92 32 102 65 95 108 C87 151 73 179 60 185 Z" fill="none" stroke="#3AA85A" stroke-width="5.5" stroke-linecap="round"/>
    
    <!-- Highlight inner vine strand -->
    <path d="M60 182 C34 169 22 136 24 95 C28 54 50 26 68 31 C88 36 98 66 92 106 C84 147 71 176 60 182" fill="none" stroke="#4AB86A" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
    
    <!-- Under-shadow accents -->
    <path d="M60 188 C30 175 14 140 18 95" fill="none" stroke="#1A6B3A" stroke-width="1.8" opacity="0.4"/>
    <path d="M72 24 C96 30 106 65 98 110" fill="none" stroke="#1A6B3A" stroke-width="1.8" opacity="0.4"/>
    
    <!-- Asymmetrical kelp fronds and bulbous nodes for loop 03 -->

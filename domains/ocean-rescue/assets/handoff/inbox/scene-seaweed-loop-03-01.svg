    <path d="M58 162 C42 142 32 112 36 88 C40 64 58 48 70 54 C82 60 84 82 78 104 C70 128 64 150 58 162" fill="none" stroke="#3AA85A" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M56 158 C42 138 34 110 37 88" fill="none" stroke="#4AB86A" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Floating kelp spore accents -->
    <circle cx="28" cy="65" r="3" fill="#2D8B46" opacity="0.6"/>
    <circle cx="92" cy="75" r="3.2" fill="#2D8B46" opacity="0.6"/>
    <circle cx="48" cy="150" r="2.8" fill="#4AB86A" opacity="0.6"/>

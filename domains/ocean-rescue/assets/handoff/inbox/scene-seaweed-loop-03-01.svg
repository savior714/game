    <circle cx="72" cy="24" r="7" fill="#3AA85A" stroke="#1A6B3A" stroke-width="1.5"/>
    <circle cx="71" cy="23" r="3.2" fill="#4AB86A" opacity="0.6"/>
    <path d="M66 18 C69 14 76 14 79 19" fill="none" stroke="#2D8B46" stroke-width="1.5" opacity="0.6"/>

    <!-- Left lower-taper node bulb -->
    <circle cx="18" cy="95" r="6.5" fill="#2D8B46" stroke="#1A6B3A" stroke-width="1.5"/>
    <circle cx="17" cy="94" r="3" fill="#4AB86A" opacity="0.5"/>

    <!-- Right mid-height bulb -->
    <circle cx="98" cy="110" r="6" fill="#3AA85A" stroke="#1A6B3A" stroke-width="1.5"/>
    <circle cx="97" cy="109" r="2.8" fill="#4AB86A" opacity="0.6"/>

    <!-- Distinctive frond shoots for loop 03 -->
    <path d="M72 24 Q84 10 96 18 Q90 28 80 30 Z" fill="#3AA85A" opacity="0.85"/>
    <path d="M18 95 Q6 108 12 122 Q20 118 20 105 Z" fill="#3AA85A" opacity="0.85"/>
    <path d="M98 110 Q110 118 106 132 Q98 128 96 118 Z" fill="#2D8B46" opacity="0.85"/>
    <path d="M42 38 Q32 26 38 16 Q46 22 46 32 Z" fill="#3AA85A" opacity="0.8"/>
    <path d="M78 165 Q90 175 82 186 Q76 180 76 170 Z" fill="#3AA85A" opacity="0.8"/>


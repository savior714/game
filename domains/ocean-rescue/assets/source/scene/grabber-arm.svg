<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 160" width="40" height="160">
  <defs>
    <linearGradient id="grabberArm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ab8e0"/>
      <stop offset="100%" stop-color="#9ad0ff"/>
    </linearGradient>
    <linearGradient id="armHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <rect x="10" y="14" width="24" height="140" rx="10" ry="10" fill="#3a6a8a" opacity="0.12"/>
  <!-- Body -->
  <rect x="8" y="10" width="24" height="140" rx="10" ry="10" fill="url(#grabberArm)"/>
  <!-- Highlight -->
  <rect x="8" y="10" width="24" height="140" rx="10" ry="10" fill="url(#armHighlight)"/>
  <!-- Panel seam -->
  <line x1="20" y1="20" x2="20" y2="140" stroke="#5a9ec4" stroke-width="1.5" opacity="0.3"/>
  <!-- Joint rings -->
  <ellipse cx="20" cy="35" rx="14" ry="4" fill="none" stroke="#5a9ec4" stroke-width="1.5" opacity="0.4"/>
  <ellipse cx="20" cy="80" rx="14" ry="4" fill="none" stroke="#5a9ec4" stroke-width="1.5" opacity="0.4"/>
  <ellipse cx="20" cy="125" rx="14" ry="4" fill="none" stroke="#5a9ec4" stroke-width="1.5" opacity="0.4"/>
  <!-- Top joint -->
  <circle cx="20" cy="15" r="6" fill="#5a9ec4" opacity="0.5"/>
  <circle cx="18" cy="13" r="2.5" fill="#9ad0ff" opacity="0.3"/>
  <!-- Bottom joint -->
  <circle cx="20" cy="145" r="6" fill="#5a9ec4" opacity="0.5"/>
  <circle cx="18" cy="143" r="2.5" fill="#9ad0ff" opacity="0.3"/>
  <!-- Rivets along seam -->
  <circle cx="20" cy="50" r="1.5" fill="#5a9ec4" opacity="0.4"/>
  <circle cx="20" cy="65" r="1.5" fill="#5a9ec4" opacity="0.4"/>
  <circle cx="20" cy="95" r="1.5" fill="#5a9ec4" opacity="0.4"/>
  <circle cx="20" cy="110" r="1.5" fill="#5a9ec4" opacity="0.4"/>
</svg>

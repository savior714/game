<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 70" width="80" height="70">
  <defs>
    <linearGradient id="grabberBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8e3f7"/>
      <stop offset="100%" stop-color="#7ab8e0"/>
    </linearGradient>
    <radialGradient id="grabberHighlight" cx="0.35" cy="0.3" r="0.45">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <rect x="12" y="24" width="60" height="40" rx="14" ry="14" fill="#3a6a8a" opacity="0.15"/>
  <!-- Body -->
  <rect x="10" y="20" width="60" height="40" rx="14" ry="14" fill="url(#grabberBase)"/>
  <!-- Highlight -->
  <rect x="10" y="20" width="60" height="40" rx="14" ry="14" fill="url(#grabberHighlight)"/>
  <!-- Panel seam -->
  <path d="M18 20 L18 60" fill="none" stroke="#5a9ec4" stroke-width="0.8" opacity="0.3"/>
  <path d="M62 20 L62 60" fill="none" stroke="#5a9ec4" stroke-width="0.8" opacity="0.3"/>
  <!-- Screen/window -->
  <rect x="18" y="28" width="44" height="24" rx="8" ry="8" fill="#9ad0ff" opacity="0.5"/>
  <rect x="20" y="30" width="40" height="20" rx="6" ry="6" fill="#b8e3f7" opacity="0.2"/>
  <!-- Status indicator dots -->
  <circle cx="28" cy="40" r="3" fill="#5a9ec4" opacity="0.7"/>
  <circle cx="38" cy="40" r="3" fill="#5a9ec4" opacity="0.5"/>
  <circle cx="48" cy="40" r="3" fill="#5a9ec4" opacity="0.3"/>
  <!-- Center detail -->
  <circle cx="40" cy="40" r="8" fill="#5a9ec4" opacity="0.6"/>
  <circle cx="38" cy="38" r="3" fill="#9ad0ff" opacity="0.4"/>
  <!-- Rivets -->
  <circle cx="16" cy="26" r="2" fill="#5a9ec4" opacity="0.5"/>
  <circle cx="64" cy="26" r="2" fill="#5a9ec4" opacity="0.5"/>
  <circle cx="16" cy="54" r="2" fill="#5a9ec4" opacity="0.5"/>
  <circle cx="64" cy="54" r="2" fill="#5a9ec4" opacity="0.5"/>
</svg>

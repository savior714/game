    <circle cx="21" cy="69" r="3.5" fill="#4AB86A" opacity="0.6"/>
    <path d="M16 64 C19 60 25 59 28 63" fill="none" stroke="#2D8B46" stroke-width="1.5" opacity="0.6"/>


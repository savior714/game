    <path d="M50 160 C38 135 34 105 45 80 C52 64 68 55 78 68 C86 78 84 98 75 118 C65 140 58 152 50 160" fill="none" stroke="#3AA85A" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>

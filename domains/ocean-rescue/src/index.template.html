<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>Ocean Rescue — AidenGame</title>
  <!-- OCEAN_RESCUE_CSS -->
</head>
<body>
  <main
    id="ocean-rescue-root"
    aria-labelledby="ocean-rescue-title"
    data-ocean-rescue-ready="false"
  >
    <h1 id="ocean-rescue-title">Ocean Rescue</h1>

    <p
      id="ocean-rescue-status"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></p>

    <section
      id="ocean-rescue-mission-select"
      aria-labelledby="ocean-rescue-mission-select-title"
    >
      <h2 id="ocean-rescue-mission-select-title">Choose a Mission</h2>
      <p>Pick a rescue mission for Aiden.</p>
      <div
        id="ocean-rescue-mission-list"
        aria-label="Rescue missions"
      ></div>
    </section>

    <section
      id="ocean-rescue-gup-select"
      aria-labelledby="ocean-rescue-gup-select-title"
      hidden
    >
      <h2 id="ocean-rescue-gup-select-title">Choose a GUP</h2>

      <p id="ocean-rescue-gup-mission"></p>

      <p>
        All GUPs complete every mission the same way.
      </p>

      <div
        id="ocean-rescue-gup-list"
        aria-label="GUP choices"
      ></div>

      <div id="ocean-rescue-gup-actions">
        <button
          id="ocean-rescue-gup-back"
          type="button"
        >
          Back
        </button>

        <button
          id="ocean-rescue-gup-launch"
          type="button"
        >
          Launch
        </button>
      </div>
    </section>

    <section
      id="ocean-rescue-launch"
      aria-labelledby="ocean-rescue-launch-title"
      hidden
    >
      <h2 id="ocean-rescue-launch-title">Launching!</h2>

      <div
        id="ocean-rescue-launch-visual"
        aria-hidden="true"
      >
        <div class="ocean-rescue-launch-door ocean-rescue-launch-door-left"></div>
        <div class="ocean-rescue-launch-door ocean-rescue-launch-door-right"></div>

        <div id="ocean-rescue-launch-gup">
          <span id="ocean-rescue-launch-gup-name"></span>
        </div>
      </div>

      <p id="ocean-rescue-launch-companion"></p>
      <p id="ocean-rescue-launch-briefing"></p>
      <p>Tap anywhere to skip.</p>

      <button
        id="ocean-rescue-launch-skip"
        type="button"
      >
        Skip
      </button>
    </section>

    <div
      id="ocean-rescue-goal-banner"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      hidden
    ></div>

    <section
      id="ocean-rescue-stage"
      aria-label="Ocean Rescue game stage"
      hidden
    >
      <canvas
        id="ocean-rescue-canvas"
        width="1280"
        height="720"
        aria-label="Ocean Rescue game scene"
      >
        Ocean Rescue requires canvas support.
      </canvas>
    </section>
  </main>

  <!-- OCEAN_RESCUE_SCRIPTS -->
</body>
</html>

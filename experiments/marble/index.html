<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>모치팝! | 마블 머지</title>
<style>
html,body{margin:0;height:100%;display:grid;place-items:center;background:#ffeef4;color:#5b3b4d;font:800 16px system-ui,sans-serif}
#loadError{max-width:32rem;padding:24px;text-align:center;line-height:1.6}
</style>
</head>
<body>
<p id="loadError">마블 게임을 불러오는 중이에요…</p>
<script src="mochipop.bundle.1.js"></script>
<script src="mochipop.bundle.2.js"></script>
<script src="mochipop.bundle.3.js"></script>
<script>
(async () => {
  try {
    if (!('DecompressionStream' in window)) {
      throw new Error('이 브라우저는 게임 번들 압축 해제를 지원하지 않습니다.');
    }
    const encoded = window.__MOCHI_BUNDLE || '';
    delete window.__MOCHI_BUNDLE;
    const bytes = Uint8Array.from(atob(encoded), ch => ch.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
    
    // Inject floating home button into document
    const style = document.createElement('style');
    style.textContent = `.float-home-btn { position: fixed; top: 14px; left: 14px; z-index: 99999; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; color: #F8FAFC; background: rgba(14, 18, 28, 0.92); border: 1px solid rgba(255, 255, 255, 0.2); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 999px; padding: 8px 16px; text-decoration: none; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); transition: all 0.2s ease; pointer-events: auto; } .float-home-btn:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.4); color: #d7ff00; }`;
    const btn = document.createElement('a');
    btn.href = '../../index.html';
    btn.className = 'float-home-btn';
    btn.setAttribute('aria-label', '메인 홈으로 이동');
    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span>홈으로</span>';
    if (document.head) document.head.appendChild(style);
    if (document.body) document.body.appendChild(btn);
  } catch (error) {
    const target = document.getElementById('loadError');
    if (target) target.textContent = '마블 게임을 불러오지 못했습니다. 최신 브라우저에서 다시 열어 주세요.';
    console.error(error);
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>모치팝! | 마블 머지</title>
<style>
html,body{margin:0;height:100%;display:grid;place-items:center;background:#ffeef4;color:#5b3b4d;font:800 16px system-ui,sans-serif}
body{grid-auto-rows:min-content;gap:10px;padding:24px;box-sizing:border-box}
#loadError{max-width:32rem;padding:24px;text-align:center;line-height:1.6}
.load-error-home{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 20px;border-radius:999px;background:#5b3b4d;color:#ffeef4;font-size:14px;font-weight:800;text-decoration:none;box-shadow:0 6px 16px rgba(91,59,77,.24)}
.load-error-home:hover{background:#6f4a5f}
.load-error-home:focus-visible{outline:3px solid #5b3b4d;outline-offset:2px}
</style>
</head>
<body>

  <!-- 로그인 gate: 세션이 확인되기 전에는 기능 surface를 fail-closed로 차단한다. -->
  <script src="../../domains/auth/auth-gate.js"></script>
  <script src="../../shared/ui/study-game-admission.js"></script>
<p id="loadError">마블 게임을 불러오는 중이에요…</p>
<a class="load-error-home" href="../../index.html" target="_top">🏠 놀이터 홈으로</a>
<script src="mochipop.bundle.1.js"></script>
<script src="mochipop.bundle.2.js"></script>
<script src="mochipop.bundle.3.js"></script>
<script>
(async () => {
  try {
    if (!window.StudyGameAdmission?.isPlaying('marble')) return;
    if (!('DecompressionStream' in window)) {
      throw new Error('이 브라우저는 게임 번들 압축 해제를 지원하지 않습니다.');
    }
    const encoded = window.__MOCHI_BUNDLE || '';
    delete window.__MOCHI_BUNDLE;
    const bytes = Uint8Array.from(atob(encoded), ch => ch.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html = await new Response(stream).text();
    // Keep auth, study admission and its absolute deadline in the outer document.
    // Replacing the document here used to discard every gate and timer.
    const frame = document.createElement('iframe');
    frame.title = '마블 머지 게임';
    frame.style.cssText = 'position:fixed;inset:76px 0 0;width:100%;height:calc(100% - 76px);border:0;';
    frame.srcdoc = html;
    document.getElementById('loadError')?.remove();
    document.body.appendChild(frame);
    window.addEventListener('message', event => {
      if (event.source === frame.contentWindow && event.data === 'closeMarble') {
        window.location.assign('../../index.html');
      }
    });
    
    // Inject unified console HUD top bar into document
    const style = document.createElement('style');
    style.textContent = `
      :root { --top-hud-offset: 60px; }
      .game-top-hud { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 99999; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: rgba(14, 18, 28, 0.88); border: 1px solid rgba(255, 255, 255, 0.14); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 999px; padding: 6px 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); pointer-events: auto; max-width: 680px; margin: 0 auto; }
      .game-top-hud .brand-badge { display: flex; align-items: center; gap: 8px; text-decoration: none; }
      .game-top-hud .brand-dot { width: 8px; height: 8px; border-radius: 50%; background: #d7ff00; box-shadow: 0 0 8px #d7ff00; }
      .game-top-hud .brand-title { font-size: 11px; font-weight: 900; letter-spacing: 0.08em; color: #d7ff00; text-transform: uppercase; font-family: system-ui, sans-serif; }
      .game-top-hud .brand-sub { font-size: 11px; font-weight: 700; color: #94a3b8; font-family: system-ui, sans-serif; }
      .game-top-hud .brand-home { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; flex: none; color: #94a3b8; transition: color 0.2s ease; }
      .game-top-hud .brand-home svg { width: 14px; height: 14px; }
      .game-top-hud .brand-badge:hover .brand-home { color: #d7ff00; }
      #app { padding-top: calc(var(--top-hud-offset, 60px) + env(safe-area-inset-top)); }
      #hud { padding-top: 4px; }
      .overlay { overflow-y: auto; gap: clamp(8px, 1.8vh, 14px); padding: clamp(14px, 2.5vh, 22px); }
      .title-blobs { margin-bottom: 0; }
      .title { font-size: clamp(32px, 6.5vh, 52px); }
      .subtitle { font-size: clamp(13px, 2vh, 15px); line-height: 1.45; }
      .howto { padding: clamp(10px, 1.8vh, 15px) clamp(14px, 2.5vh, 18px); font-size: clamp(12px, 1.9vh, 14px); line-height: 1.5; }
      .howto li { margin: 3px 0; }
      .primary { min-height: clamp(46px, 7.2vh, 56px); font-size: clamp(17px, 2.6vh, 20px); }
    `;
    // document.write로 head가 비므로 공용 홈 버튼 스타일도 함께 주입한다.
    const homeButtonCss = document.createElement('link');
    homeButtonCss.rel = 'stylesheet';
    homeButtonCss.href = '../../shared/ui/home-button.css';
    const hud = document.createElement('header');
    hud.className = 'game-top-hud';
    hud.innerHTML = `
      <div style="display: flex; align-items: center; gap: 10px;">
        <a href="../../index.html" target="_top" class="ag-home-btn" aria-label="놀이터 홈으로 이동" title="놀이터 홈으로">
          <span class="ag-home-btn__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></span>
          <span class="ag-home-btn__label">홈</span>
        </a>
        <a href="../../index.html" target="_top" class="brand-badge" aria-label="AIDEN GAME LABS · 놀이터 홈">
          <div class="brand-dot"></div>
          <span class="brand-home" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          </span>
          <div>
            <span class="brand-title">AIDEN GAME LABS</span>
            <span class="brand-sub"> · 마블 머지</span>
          </div>
        </a>
      </div>
      <div class="ag-hud__right"></div>
    `;
    if (document.head) document.head.appendChild(homeButtonCss);
    if (document.head) document.head.appendChild(style);
    if (document.body) document.body.appendChild(hud);
    if (window.AidenFullscreenToggle && typeof window.AidenFullscreenToggle.mount === 'function') {
      window.AidenFullscreenToggle.mount();
    }

    const syncTopHudOffset = () => {
      const rect = hud.getBoundingClientRect();
      if (rect && rect.height > 0) {
        const offset = Math.max(56, Math.ceil(rect.bottom + 8));
        document.documentElement.style.setProperty('--top-hud-offset', `${offset}px`);
      }
      window.dispatchEvent(new Event('resize'));
    };
    syncTopHudOffset();
    window.addEventListener('resize', syncTopHudOffset);
  } catch (error) {
    const target = document.getElementById('loadError');
    if (target) target.textContent = '마블 게임을 불러오지 못했습니다. 최신 브라우저에서 다시 열어 주세요.';
    console.error(error);
  }
})();
</script>
<script src="../../shared/ui/fullscreen-toggle.js"></script>
</body>
</html>

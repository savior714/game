<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우주 탐험 | Space Explorer</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .explorer-layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 16px;
      max-width: 1320px;
    }

    .canvas-panel h2 {
      margin-bottom: 12px;
    }

    .scene-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: #081326;
    }

    .scene-wrap canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .scene-wrap .three-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .scene-wrap canvas {
      position: relative;
      z-index: 2;
    }

    /* 컨트롤 패널 */
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .controls-panel h2 {
      margin-bottom: 4px;
    }

    .control-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #a0aac8;
    }

    /* 속도 슬라이드 */
    .speed-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .speed-control input[type="range"] {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: linear-gradient(to right, #4a68e8, #7ec8f0);
      border-radius: 3px;
      outline: none;
    }

    .speed-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    .speed-control input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      border: none;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    #speed-value {
      min-width: 48px;
      text-align: right;
      font-weight: 600;
      font-size: 14px;
      color: #c8d4ff;
    }

    /* 경과 시간 */
    .elapsed-display {
      background: rgba(74,104,232,0.12);
      border: 1px solid rgba(74,104,232,0.25);
      border-radius: 8px;
      padding: 10px 14px;
      text-align: center;
    }

    .elapsed-label {
      font-size: 11px;
      color: #8090c0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #elapsed-time {
      font-size: 22px;
      font-weight: 700;
      color: #c8d8ff;
      font-variant-numeric: tabular-nums;
    }

    /* 행성 정보 패널 */
    .planet-info-panel {
      background: rgba(30,40,80,0.5);
      border: 1px solid rgba(100,130,255,0.2);
      border-radius: 10px;
      padding: 14px;
      flex: 1;
      overflow-y: auto;
    }

    .planet-info-panel h3 {
      margin: 0 0 12px;
      font-size: 18px;
      color: #e0e8ff;
    }

    .info-planet-en {
      font-size: 13px;
      color: #8090c0;
      font-weight: 400;
    }

    .info-placeholder {
      color: #6070a0;
      font-size: 13px;
      text-align: center;
      padding: 20px 0;
      margin: 0;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .info-item {
      background: rgba(255,255,255,0.04);
      border-radius: 6px;
      padding: 8px 10px;
    }

    .info-label {
      display: block;
      font-size: 10px;
      color: #7080b0;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 3px;
    }

    .info-value {
      display: block;
      font-size: 13px;
      color: #c8d4ff;
      font-weight: 600;
    }

    .info-description {
      font-size: 12px;
      color: #90a0d0;
      line-height: 1.6;
      margin: 0;
    }

    @media (max-width: 900px) {
      .explorer-layout {
        grid-template-columns: 1fr;
      }

      .controls-panel {
        order: -1;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1 class="brand">Space Explorer</h1>
    <nav aria-label="Main navigation">
      <ul class="nav-list">
        <li><a href="../index.html">홈</a></li>
        <li><a href="./index.html" aria-current="page">우주 탐험</a></li>
      </ul>
    </nav>
  </header>

  <main class="container explorer-layout">
    <section class="card canvas-panel" aria-label="태양계 캔버스 영역">
      <h2>태양계 시뮬레이션</h2>
      <div class="scene-wrap">
        <div id="space-explorer-three-layer" class="three-layer" aria-hidden="true"></div>
        <canvas id="solar-system-canvas" width="960" height="540" role="img" aria-label="태양과 행성 시뮬레이션 캔버스" aria-describedby="simulation-status"></canvas>
      </div>
    </section>

    <aside class="card controls-panel" aria-label="시뮬레이션 컨트롤">
      <h2>컨트롤</h2>
      <p id="simulation-status" class="status-badge" aria-live="polite">재생 중 · 100% · 2D</p>

      <div class="elapsed-display">
        <span class="elapsed-label">경과 시간</span>
        <div id="elapsed-time">0.0년</div>
      </div>

      <div class="control-group">
        <label for="time-scale">시뮬레이션 속도</label>
        <div class="speed-control">
          <input type="range" id="time-scale" name="time-scale" min="0.1" max="3" step="0.1" value="0.5" />
          <span id="speed-value">50%</span>
        </div>
      </div>

      <div class="control-group">
        <label for="render-quality">렌더 모드</label>
        <select id="render-quality" name="render-quality">
          <option value="2d" selected>2D (평면)</option>
          <option value="3d">3D (입체)</option>
        </select>
      </div>

      <div class="control-group">
        <label>
          <input type="checkbox" checked />
          행성 라벨 표시
        </label>
      </div>

      <div class="control-group">
        <button type="button" data-action="play">재생</button>
        <button type="button" data-action="pause">일시정지</button>
        <button type="button" data-action="reset">초기화</button>
      </div>

      <p class="gesture-hint">핀치로 확대/축소, 마우스 휠로도 확대/축소, 두 손가락 회전으로 시야를 조절할 수 있어요.</p>

      <div class="planet-info-panel">
        <h3>행성 정보<span class="info-planet-en"></span></h3>
        <div id="planet-info">
          <p class="info-placeholder">
            행성을 클릭하면 상세 정보를 볼 수 있습니다.
          </p>
        </div>
      </div>
    </aside>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>

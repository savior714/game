<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공전·자전과 일식/월식 | Space Explorer</title>
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="./space-explorer.css" />
</head>
<body class="se-page">
  <header class="site-header">
    <h1 class="brand">Space Explorer</h1>
    <nav aria-label="Main navigation">
      <ul class="nav-list">
        <li><a href="../../index.html" aria-label="메인 홈으로 이동">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>홈으로</span>
        </a></li>
        <li><a href="./index.html">태양계 탐험</a></li>
        <li><a href="./orbit-eclipse.html" aria-current="page">공전·자전과 일식/월식</a></li>
      </ul>
    </nav>
  </header>

  <main class="container lesson-layout">
    <section class="card" aria-label="공전과 일식 월식 장면">
      <h2>태양-지구-달 움직임</h2>
      <div class="lesson-scene-wrap">
        <div id="orbit-eclipse-three-layer" class="three-layer" aria-hidden="true"></div>
        <canvas
          id="orbit-eclipse-canvas"
          class="lesson-canvas"
          width="960"
          height="540"
          role="img"
          aria-label="태양 지구 달의 움직임과 일식 월식 설명 캔버스"
          aria-describedby="lesson-explanation"
        ></canvas>
      </div>
    </section>

    <aside class="card controls-panel" aria-label="학습 모드 선택">
      <h2>학습 모드</h2>
      <div class="control-group">
        <label for="lesson-mode">주제 선택</label>
        <select id="lesson-mode" name="lesson-mode">
          <option value="rotation-revolution" selected>자전과 공전</option>
          <option value="solar-eclipse">일식</option>
          <option value="lunar-eclipse">월식</option>
        </select>
      </div>
      <div class="control-group">
        <label for="lesson-speed">애니메이션 속도</label>
        <select id="lesson-speed" name="lesson-speed">
          <option value="0.7">느리게</option>
          <option value="1" selected>보통</option>
          <option value="1.4">빠르게</option>
        </select>
      </div>
      <div class="control-group">
        <label for="lesson-render-mode">보기 모드</label>
        <select id="lesson-render-mode" name="lesson-render-mode">
          <option value="2d" selected>2D</option>
          <option value="3d">3D</option>
        </select>
      </div>
      <p id="lesson-explanation" aria-live="polite"></p>
      <p class="mini-note">태양은 가운데에 고정되어 있고, 지구는 태양 둘레를 공전하며 스스로 자전해요. 달은 지구 둘레를 공전해요.</p>
    </aside>
  </main>

  <script type="module" src="./orbit-eclipse.js"></script>
</body>
</html>

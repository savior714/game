[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
addopts =
    -q
    --tdd-gate=hard
    --tdd-base-ref=HEAD
    -m "not browser and not live"
    --timeout=30
timeout_method = thread
markers =
    browser: marks browser automation tests (Playwright)
    live: marks tests requiring real Supabase or live network services
    slow: marks slow tests taking over 5 seconds
    ocean_rescue: marks ocean rescue domain tests
    signed_out: runs browser tests without a seeded login session
    real_supabase: uses the real Supabase CDN SDK (network required)
    unentitled_study_game: runs browser tests without a seeded Ocean Rescue admission session
